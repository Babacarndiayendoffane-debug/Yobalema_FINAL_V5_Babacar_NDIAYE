name: Yobalema Masterclass CI

on:
  push:
    branches: [main, feature/masterclass-production]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/Yobalema_Kaolack_Updated_White
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test --coverage

  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/yobalema_backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/yobalema_backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: TypeScript build
        run: npm run build
      - name: Tests
        run: npm test
