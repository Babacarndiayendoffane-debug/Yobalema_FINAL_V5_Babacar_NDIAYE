<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yobalema — Admin</title>
<style>body{font-family:Inter,Arial,sans-serif;background:#f5f5f0;margin:0;color:#151515}.wrap{max-width:1200px;margin:auto;padding:24px}.hero{background:#111;color:#fff;border-radius:26px;padding:28px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 30px #0000000d;margin-bottom:16px}.num{font-size:28px;font-weight:900}.muted{color:#777}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.token{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px}.btn{background:#ffcc00;border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.pill{padding:5px 9px;border-radius:20px;background:#eee;font-size:12px}.item{border-top:1px solid #eee;padding:13px 0}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div class="hero"><h1>Yobalema · Centre de contrôle</h1><p>Kaolack · courses · chauffeurs · support · finances</p></div>
<div class="card"><div class="row"><strong>Jeton administrateur</strong><button class="btn" onclick="loadAll()">Actualiser</button></div><input id="token" class="token" placeholder="JWT admin" style="margin-top:10px"></div>
<div id="stats" class="grid"></div>
<div class="card"><h2>Chauffeurs</h2><div id="drivers"></div></div>
<div class="card"><h2>Support</h2><div id="tickets"></div></div></div>
<script>async function api(path,opt={}){const t=document.getElementById('token').value.trim();const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+t,...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.json()}async function loadAll(){try{const s=await api('/api/admin/stats');document.getElementById('stats').innerHTML=[['Utilisateurs',s.users],['Chauffeurs',s.drivers],['Courses',s.rides],['Terminées',s.completedRides],['Revenus',s.platformRevenueFcfa+' FCFA']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('');const d=await api('/api/admin/drivers');document.getElementById('drivers').innerHTML=d.map(x=>`<div class="item"><div class="row"><strong>${x.user?.name||'Sans nom'}</strong><span class="pill">${x.status} · ${x.verificationStatus}</span></div><div class="muted">${x.user?.phone||''} · ${x.vehicleType||'véhicule ?'} · ${x.vehiclePlate||'plaque ?'} · ⭐ ${Number(x.rating||5).toFixed(1)}</div><div style="margin-top:8px"><button class="btn" onclick="verify('${x.userId}','VERIFIED')">Valider</button> <button class="btn" onclick="verify('${x.userId}','REJECTED')">Refuser</button></div></div>`).join('');const t=await api('/api/admin/support/tickets');document.getElementById('tickets').innerHTML=t.length?t.map(x=>`<div class="item"><div class="row"><strong>${x.subject}</strong><span class="pill">${x.status}</span></div><div>${x.message}</div><div class="muted">${x.user?.name||''} · ${x.user?.phone||''}</div><div style="margin-top:8px"><button class="btn" onclick="ticket('${x.id}','IN_PROGRESS')">Prendre</button> <button class="btn" onclick="ticket('${x.id}','RESOLVED')">Résoudre</button></div></div>`).join(''):'Aucun ticket.'}catch(e){alert('Erreur : '+e.message)}}async function verify(id,status){await api('/api/admin/drivers/'+id+'/verification',{method:'PATCH',body:JSON.stringify({status})});loadAll()}async function ticket(id,status){await api('/api/admin/support/tickets/'+id,{method:'PATCH',body:JSON.stringify({status})});loadAll()}</script><footer style="text-align:center;padding:24px;color:#666;font-size:13px">© 2026 Yobalema — Créée par Babacar NDIAYE</footer></body></html>
